<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Simple Sidescroller</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#87ceeb"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="Sidescroller">
<style>
:root{--bg:#dfe7ee;--fg:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1218;--fg:#eee}}
:root[data-theme="dark"]{--bg:#0e1218;--fg:#eee}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#w{position:relative;width:min(100vw,calc((100vh - 8px)*1.8));width:min(100vw,calc((100dvh - 4px)*1.8));aspect-ratio:9/5;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{width:100%;height:100%;display:block;background:#87ceeb}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2%;background:rgba(0,0,0,.4);color:#fff;text-align:center}
.ov[hidden],#tc[hidden]{display:none}
h1{margin:0;font-size:clamp(16px,5vw,42px);letter-spacing:.06em}
p{margin:0;font-size:clamp(10px,1.8vw,15px)}
.row{display:flex;gap:2%;width:92%;justify-content:center}
button{font:700 clamp(10px,2.2vw,18px) system-ui,sans-serif;background:#fff;color:#000;border:3px solid #000;padding:1.2% 2%;cursor:pointer}
.row button{flex:1;display:flex;flex-direction:column;gap:6px;padding:3%}
small{font-weight:400;font-size:.62em}
.panel{background:#f5f5fa;color:#000;border:3px solid #000;width:92%;height:90%;display:flex;flex-direction:column;padding:1.5%;box-sizing:border-box}
.panel .row{justify-content:space-between;width:100%}
#cg{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2%;margin-top:1.2%;overflow:auto}
#cg button{background:#e1e4f0;font-size:clamp(8px,1.7vw,13px);padding:6px 2px}
#rot{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,14,20,.94);color:#fff;text-align:center;font-size:18px;font-weight:700}#rot span{font-size:56px}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}}
.t{position:absolute;opacity:.6;-webkit-user-select:none;user-select:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);border:3px solid rgba(0,0,0,.6);font-weight:700;font-size:clamp(9px,2.4vw,18px);color:#000;touch-action:none}
</style></head><body>
<div id="rot"><span>↻</span>Rotate your phone to landscape</div>
<div id="w">
<canvas id="c" width="720" height="400"></canvas>
<div id="menu" class="ov"><h1>SIMPLE SIDESCROLLER</h1>
<div class="row"><button data-m="story">STORY<small>Beat the royal guards, then face the king</small></button><button data-m="hard">HARD STORY<small>The full story with cheats off</small></button><button data-m="endless">ENDLESS<small>Bosses forever, and it keeps getting harder</small></button></div>
<button id="mapb">MAP: GRASSLAND</button><p id="hint"></p></div>
<div id="over" class="ov" hidden><h1>GAME OVER</h1><p id="sc"></p><div class="row" style="width:50%"><button id="again">RESTART</button><button id="tomenu">MENU</button></div></div>
<div id="cheats" class="ov" hidden><div class="panel"><div class="row"><b>CHEATS - tap one</b><button id="cx">CLOSE</button></div><div id="cg"></div></div></div>
<div id="tc" hidden>
<div class="t" data-k="left" style="left:1.5%;bottom:3%;width:11%;height:20%">&lt;</div>
<div class="t" data-k="right" style="left:13.5%;bottom:3%;width:11%;height:20%">&gt;</div>
<div class="t" data-k="jump" style="right:15%;bottom:3%;width:12%;height:22%">JUMP</div>
<div class="t" data-k="fire" style="right:1.5%;bottom:3%;width:12%;height:22%">FIRE</div>
<div class="t" data-k="down" style="right:15%;bottom:27%;width:12%;height:13%">DOWN</div>
<div class="t" data-a="wp" style="right:19%;top:9%;width:9%;height:8%">WEAPON</div>
<div class="t" data-a="ab" style="right:9.5%;top:9%;width:9%;height:8%">ABILITY</div>
<div class="t" data-a="use" style="right:1%;top:9%;width:8%;height:8%">USE</div>
<div class="t" data-a="ch" style="right:1%;top:19%;width:17%;height:8%">CHEATS</div>
<div class="t" data-a="mu" style="right:19%;top:19%;width:9%;height:8%">MUSIC</div>
</div>
</div>
<script>
"use strict";
const W=720,H=400,GY=350,cv=document.getElementById("c"),g=cv.getContext("2d"),$=id=>document.getElementById(id);
const K={},T={};let scr="menu",mode="story",map="grass",best=0,S,en=[],bo=[],bu=[],co=[],pk=[],wi=[],cl=[],ho=[],P={x:50,y:310,w:40,h:40,vy:0,on:1};
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const WP={pistol:{n:"PISTOL",c:"#464646",k:"gun",cd:15,d:1,sp:10,life:60,sz:12},shotgun:{n:"SHOTGUN",c:"#8b4513",k:"gun",cd:40,d:1,sp:9,life:25,sz:8,pel:5},rifle:{n:"RIFLE",c:"#006400",k:"gun",cd:25,d:3,sp:16,life:60,sz:16},smg:{n:"SMG",c:"#3c5082",k:"gun",cd:6,d:1,sp:12,life:45,sz:10},guitar:{n:"GUITAR",c:"#9600c8",k:"gun",cd:25,d:3,sp:7,life:70,sz:20},santoryu:{n:"THREE SWORDS",c:"#3cbe5a",k:"gun",cd:18,d:4,sp:13,life:50,sz:22,pierce:1},sword:{n:"SWORD",c:"#c8c8d2",k:"melee",cd:20,d:3,r:55},firesword:{n:"FIRE SWORD",c:"#ff7800",k:"melee",cd:20,d:6,r:70},bonk:{n:"BONK",c:"#a86e34",k:"melee",cd:24,d:99999,r:85},hammer:{n:"THUNDER HAMMER",c:"#6ea0e6",k:"hammer",cd:28,d:4},dragon:{n:"DRAGON",c:"#1ea03c",k:"dragon",cd:0,d:1},bloodmoon:{n:"BLOOD MOON",c:"#be2023",k:"moon",cd:600,d:500}};
const SPAWN=["pistol","pistol","shotgun","shotgun","rifle","smg","sword","sword","firesword","guitar","dragon","hammer","santoryu","bloodmoon"];
const AB={fireball:{n:"FIREBALL",cd:45},shield:{n:"SHIELD",cd:900},toxic:{n:"TOXIC GAS",cd:600},nuke:{n:"NUKE",cd:1800},purple:{n:"HOLLOW PURPLE",cd:1500},kamehameha:{n:"KAMEHAMEHA",cd:1200},ultrainstinct:{n:"ULTRA INSTINCT",cd:1500},impact:{n:"GALAXY IMPACT",cd:900},haki:{n:"CONQUEROR’S HAKI",cd:1100},shrine:{n:"MALEVOLENT SHRINE",cd:1800},spiritbomb:{n:"SPIRIT BOMB",cd:1500},flashdrive:{n:"FLASH DRIVE",cd:1800}};
const REW={50:"fireball",100:"shield",150:"toxic",250:"kamehameha",300:"purple",200:"haki",350:"ultrainstinct",400:"impact",450:"spiritbomb",500:"nuke",650:"shrine",700:"flashdrive"};
const CH={thor:"hammer",goku:"kamehameha",gojo:"purple",zoro:"santoryu",instinct:"ultrainstinct",king:"finalboss",father:"finalboss",bat:"bonk",usb:"flashdrive",moon:"bloodmoon",genkidama:"spiritbomb",horse:"horse"};
Object.keys(WP).concat(Object.keys(AB),["egypt","finalboss","horse"]).forEach(k=>CH[k]=k);
const CHW=Object.keys(CH).sort((a,b)=>b.length-a.length);

function reset(){
 P.x=50;P.y=310;P.vy=0;P.on=1;
 S={hp:100,inv:0,score:0,lives:3,diff:0,face:1,tick:0,wend:1400,nb:50,wp:[],cur:0,ab:[],abi:0,cd:{},shoot:0,swing:0,drag:0,shield:0,nuke:0,ui:0,kame:null,pur:null,bolt:null,msg:"",mt:0,end:0,typed:"",shake:0,t0:0,hs:null,hw:0,moon:null,cor:null,bomb:null,shr:0,fx:null,cut:null,bx:0};
 Object.keys(AB).forEach(k=>S.cd[k]=0);
 en=[];bo=[];bu=[];cl=[];co=[];pk=[];wi=[];ho=[mkH(620)];
 [300,500,700,900,1100].forEach(x=>co.push({x,y:GY-40,w:20,h:20}));
 [650,1050].forEach(x=>pk.push({x,y:GY-40,w:20,h:20}));
 wi.push({x:200,y:GY-34,w:28,h:18,k:"pistol"},{x:950,y:GY-34,w:28,h:18,k:"sword"});
 if(map=="egypt")wi.push({x:720,y:GY-34,w:28,h:18,k:"hammer"});
 en.push(mkE(400,350,550,0,1),mkE(800,750,950,0,1),mkE(1200,1150,1400,1,-1));
}
function mkE(x,l,r,t,d){return{x,y:GY-40,w:40,h:40,l,r,d,sp:Math.min((t?3:2)+Math.floor(S.diff/3),7),h_:0,hn:(t?5:3)+Math.floor(S.diff/4),c:t?"#800080":"#c81e1e",fr:0}}
function say(t){S.msg=t;S.mt=180}
function alive(t){return en.includes(t)||bo.includes(t)}
function dmg(t,a){if(t.hn)dmgE(t,a);else dmgB(t,a)}
function dmgE(e,a){e.h_+=a;if(e.h_>=e.hn&&en.includes(e)){en.splice(en.indexOf(e),1);S.score+=2;sfx("k")}}
function dmgB(b,a){b.hp-=a;if(b.hp<=0&&bo.includes(b))killB(b)}
function killB(b){
 bo.splice(bo.indexOf(b),1);
 if(b.king){playCut(OUTRO);return}
 S.score+=20;S.diff++;sfx("b");let m=b.dr?"THE DRAGON HAS FALLEN":"ONE OF THE ROYAL GUARDS HAS FALLEN";
 if(REW[b.lv]){addA(REW[b.lv]);m+=" - "+AB[REW[b.lv]].n+" GAINED"}
 say(m);
}
function hurt(a){if(S.shield>0||S.ui>0)return;sfx("o");S.inv=60;if(S.hs){S.hs.hp-=a;if(S.hs.hp<=0){S.hs=null;S.hw=45;say("YOUR HORSE HAS FALLEN!")}return}S.hp-=a}
function addW(k){if(!S.wp.includes(k))S.wp.push(k);S.cur=S.wp.indexOf(k)}
function addA(k){if(!S.ab.includes(k))S.ab.push(k);S.abi=S.ab.indexOf(k)}
const cw=()=>S.wp.length?S.wp[S.cur]:null;
function loseLife(){
 S.lives--;
 if(S.lives<=0){sfx("go");S.hp=0;scr="over";if(mode=="endless"&&S.score>best)best=S.score;$("sc").textContent="Score: "+S.score+(mode=="endless"?"   Best: "+best:"");$("over").hidden=false;return}
 sfx("ls");S.hp=100;S.inv=150;P.vy=0;bu=[];cl=[];
 en=en.filter(e=>Math.abs(e.x-P.x)>=280);
 bo.forEach(b=>{b.x=P.x+(b.x>P.x?600:-600)});
 say("LIFE LOST!  "+S.lives+(S.lives==1?" LIFE":" LIVES")+" LEFT");
}
function give(k){
 if(mode=="hard"){say("CHEATS ARE OFF IN HARD STORY");return}
 if(k=="horse"){if(S.hs)say("YOU ARE ALREADY RIDING A HORSE");else{ho.push(mkH(P.x+S.face*90));say("CHEAT: HORSE!  walk into it to ride")}return}if(k=="egypt"){map=map=="egypt"?"grass":"egypt";say("CHEAT: "+(map=="egypt"?"WELCOME TO EGYPT":"BACK TO THE GRASSLANDS"));return}
 if(k=="finalboss"){if(mode=="endless"){say("THE KING IS ONLY IN STORY MODE");return}S.score=Math.max(S.score,1000);S.nb=1000;S.diff=Math.max(S.diff,19);S.hp=100;bo=[];if(!S.wp.length)addW("pistol");say("CHEAT: THE KING AWAITS");return}
 if(AB[k]){addA(k);say("CHEAT: "+AB[k].n+" ability added!");return}
 addW(k);say("CHEAT: "+WP[k].n+" added!");
}
function cont(l){if(mode=="hard")return false;const t=S.typed+l;for(let i=0;i<t.length-1||i==0;i++){const s=t.slice(i);if(CHW.some(c=>c.startsWith(s)&&c.length>s.length-0&&s.length>1))return true}return false}

function proj(d,vy,k,c){
 const w=d.sz,h=k=="sk"?w:Math.max(6,w/2),x=S.face==1?P.x+P.w+16:P.x-16-w;
 bu.push({x,y:P.y+27-h/2,w,h,vx:d.sp*S.face,vy,d:d.d,life:d.life,c:c||d.c,k:k||"b",pierce:d.pierce,hh:[]});
}
function fire(){
 if(S.drag>0){proj({sz:26,sp:9,d:1,life:30},0,"fire","#ff7800");S.shoot=8;return}
 const k=cw();if(!k)return;const d=WP[k];S.shoot=d.cd;sfx(d.k=="melee"?"s":d.k=="hammer"?"z":"g");
 if(d.k=="gun"){const n=d.pel||1;for(let i=0;i<n;i++)proj(d,i-(n>>1),k=="guitar"?"sk":k=="santoryu"?"sl":"b")}
 else if(d.k=="melee"){
  const bx={x:S.face==1?P.x+P.w:P.x-d.r,y:k=="bonk"?P.y-40:P.y-5,w:d.r,h:k=="bonk"?120:50};
  en.slice().forEach(e=>{if(hit(bx,e))dmgE(e,d.d)});bo.slice().forEach(b=>{if(hit(bx,b))dmgB(b,d.d)});S.swing=8;
 }
 else if(d.k=="hammer"){
  const sx=S.face==1?P.x+P.w:P.x,bx={x:S.face==1?sx:sx-480,y:P.y-30,w:480,h:90},tg=en.concat(bo).filter(t=>hit(bx,t)),seg=[[sx,P.y+5,sx+S.face*480,P.y+5]],done=tg.slice();
  tg.forEach(t=>{seg.push([t.x+t.w/2,0,t.x+t.w/2,t.y]);en.concat(bo).filter(o=>!done.includes(o)&&Math.abs(o.x-t.x)<170).slice(0,2).forEach(o=>{done.push(o);seg.push([t.x+t.w/2,t.y+20,o.x+o.w/2,o.y+20])})});
  done.forEach((t,i)=>{if(alive(t))dmg(t,i<tg.length?4:2)});S.bolt={t:14,seg};
 }
 else if(d.k=="dragon"){S.drag=600;S.shoot=10;P.vy=0;say("DRAGON MODE!  UP/DOWN = fly, FIRE = breathe fire")}
 else if(d.k=="moon"){if(S.moon)return;let x=P.x+S.face*320,bd=801;en.concat(bo).forEach(t=>{const dd=(t.x-P.x)*S.face;if(dd>0&&dd<bd&&hit(inView(),t)){bd=dd;x=t.x+t.w/2}});S.moon={ph:0,t:0,x,y:70,r:20,vy:0,b:0};sfx("ri2");say("BLOOD MOON SUMMONER!  the moon answers...")}
}
function useAb(){
 const k=S.ab[S.abi];if(!k){say("No abilities yet - defeat a boss!");return}
 if(S.cd[k]>0){say(AB[k].n+" is recharging...");return}
 S.cd[k]=AB[k].cd;sfx(({fireball:"f",shield:"sh",toxic:"tx",nuke:"b",purple:"ri",kamehameha:"ri",ultrainstinct:"ui",impact:"z",haki:"hk",shrine:"hk",spiritbomb:"ri2",flashdrive:"fd"})[k]);
 if(k=="fireball")proj({sz:24,sp:8,d:4,life:80},0,"fb","#dc2800");
 else if(k=="shield"){S.shield=300;say("SHIELD ON!  Nothing can hurt you")}
 else if(k=="toxic"){cl.push({x:P.x+P.w/2-110,y:GY-110,w:220,h:110,life:480});say("TOXIC GAS!")}
 else if(k=="nuke"){const v={x:P.x-100,y:0,w:W,h:H};en.slice().forEach(e=>{if(hit(v,e))dmgE(e,999)});bo.slice().forEach(b=>{if(hit(v,b))killB(b)});S.nuke=40;say("NUKE!")}
 else if(k=="purple"){S.pur={ph:0,t:60};say("LAPSE: BLUE      REVERSAL: RED")}
 else if(k=="kamehameha"){S.kame={ph:0,t:40,dir:S.face};say("KA...  ME...  HA...  ME...")}
 else if(k=="ultrainstinct"){S.ui=360;say("ULTRA INSTINCT!  nothing can touch you")}
 else if(k=="impact"){const a={x:S.face==1?P.x+46:P.x-46-420,y:0,w:420,h:GY};en.slice().forEach(e=>{if(hit(a,e))dmgE(e,999)});bo.slice().forEach(b=>{if(hit(a,b))dmgB(b,60)});S.fx={k:"i",t:30,T:30,x:P.x+(S.face==1?46:-6),y:P.y+27,d:S.face};S.shake=22;sfx("z");say("GALAXY IMPACT!")}
 else if(k=="haki"){en.slice().forEach(e=>{if(Math.abs(e.x-P.x)<450){if(e.hn-e.h_<=4)dmgE(e,999);else e.fr=240}});bo.slice().forEach(b=>{if(Math.abs(b.x-P.x)<450){b.fr=240;dmgB(b,8)}});S.fx={k:"h",t:34,T:34,x:P.x+20,y:P.y+20,d:1};S.shake=10;say("CONQUEROR’S HAKI!")}
 else if(k=="shrine"){S.shr=150;say("DOMAIN EXPANSION:  MALEVOLENT SHRINE")}
 else if(k=="spiritbomb"){if(!S.bomb){S.bomb={ph:0,t:90,x:P.x+20,y:P.y-70,dir:S.face};say("GATHERING ENERGY...")}}
 else if(k=="flashdrive"){if(!S.cor){S.cor={t:480,x:P.x+S.face*60,sp:[]};say("FLASH DRIVE PLUGGED IN...  THE WORLD IS CORRUPTING")}}
}
/* ---- horses, extra abilities, audio, cutscenes ---- */
function mkH(x){return{x,y:GY-44,w:64,h:44,hp:60,c:["#965f2d","#eeeee8","#3e2c22","#be8246"][rnd(0,3)]}}
function dis(){if(!S.hs)return;ho.push({x:P.x-S.face*70-12,y:GY-44,w:64,h:44,hp:S.hs.hp,c:S.hs.c});S.hs=null;S.hw=45}
function horsey(D){
 if(S.hw>0)S.hw--;en.forEach(e=>{if(e.tr>0)e.tr--});
 if(S.hs){if(D&&P.on)dis();else{const hb={x:P.x-12,y:P.y,w:64,h:60};en.slice().forEach(e=>{if(!(e.tr>0)&&hit(hb,e)){e.tr=20;dmgE(e,2)}})}return}
 if(S.hw>0||S.drag>0)return;
 const i=ho.findIndex(h=>hit(P,h));if(i>=0){S.hs={hp:ho[i].hp,c:ho[i].c};ho.splice(i,1);sfx("hs");say("YOU ARE RIDING A HORSE!  JUMP = SPACE, HOP OFF = DOWN")}
}
function inView(){return{x:P.x-100,y:0,w:W,h:H}}
function extra(){
 const m=S.moon;
 if(m){if(m.ph==0){m.t++;m.r=20+35*Math.min(1,m.t/55);if(m.t>=55){m.ph=1;m.vy=6;say("THE MOON FALLS!")}}
 else if(m.ph==1){m.y+=m.vy;m.vy+=1.4;m.r=Math.min(120,55+(m.y-70)*.35);if(m.y+m.r>=GY){m.ph=2;m.b=40;const a={x:m.x-380,y:0,w:760,h:GY};en.concat(bo).forEach(t=>{if(hit(a,t))dmg(t,500)});S.shake=30;sfx("b");say("BLOOD MOON IMPACT!  500 DAMAGE")}}
 else if(--m.b<=0)S.moon=null}
 const c=S.cor;
 if(c){c.t--;const el=480-c.t;en.concat(bo).forEach(t=>{if(t.sw>0)t.sw--});
  c.sp.slice().forEach(p=>{const t=p.t;if(!alive(t)){c.sp.splice(c.sp.indexOf(p),1);return}p.x=t.x+t.w/2;p.y+=24;if(p.y>=t.y+10){c.sp.splice(c.sp.indexOf(p),1);S.shake=Math.max(S.shake,4);sfx("sp");if(t.hn)dmgE(t,999);else{t.sw=40;dmgB(t,15)}}});
  if(el>=40&&c.t>30&&el%3==0){const v=inView(),t=en.concat(bo).find(t=>hit(v,t)&&!c.sp.some(p=>p.t==t)&&!(t.sw>0));if(t)c.sp.push({t,x:t.x+t.w/2,y:-10})}
  if(c.t<=0){S.cor=null;say("The corruption fades")}}
 const b=S.bomb;
 if(b){if(b.ph==0){b.x=P.x+20;b.y=P.y-70;if(--b.t<=0){b.ph=1;b.dir=S.face}}
 else if(b.ph==1){b.x+=7*b.dir;b.y+=2;const r={x:b.x-36,y:b.y-36,w:72,h:72};if(b.y+36>=GY||en.concat(bo).some(t=>hit(r,t))){b.ph=2;b.t=28;b.y=Math.min(b.y,GY-30);const a={x:b.x-320,y:0,w:640,h:GY};en.slice().forEach(e=>{if(hit(a,e))dmgE(e,999)});bo.slice().forEach(t=>{if(hit(a,t))dmgB(t,60)});S.shake=18;sfx("b");say("SPIRIT BOMB!")}}
 else if(--b.t<=0)S.bomb=null}
 if(S.shr>0){S.shr--;if(S.shr%10==0){sfx("sl");const v=inView();en.concat(bo).forEach(t=>{if(hit(v,t))dmg(t,2)})}}

 bu.forEach(b=>{const x=sx(b.x);if(b.k=="sk"||b.k=="fb"){circ(x+b.w/2,b.y+b.h/2,b.w/2,b.k=="sk"?"#fff":"#dc2800");if(b.k=="fb")circ(x+b.w/2,b.y+b.h/2,b.w/4,"#ff0")}else if(b.k=="fire"){g.fillStyle="#ff7800";g.beginPath();g.ellipse(x+13,b.y+7,13,7,0,0,7);g.fill()}else if(b.k=="sl"){g.strokeStyle="#3cbe5a";g.lineWidth=6;g.beginPath();g.arc(x+(b.vx>0?0:b.w),b.y+b.h/2,b.h/2,b.vx>0?-1.57:1.57,b.vx>0?1.57:4.71);g.stroke()}else rect(x,b.y,b.w,b.h,"#ff0")});
 if(S.pur&&S.pur.ph==1){const x=sx(S.pur.x);circ(x,S.pur.y,48,"#460a78");circ(x,S.pur.y,42,"#9628e6");circ(x,S.pur.y,28,"#ebc8ff");circ(x,S.pur.y,14,"#fff")}
 else if(S.pur){const t=1-S.pur.t/60,x=sx(P.x+20+S.face*60),gp=80*(1-t);circ(x-gp,P.y+12-26*(1-t),12+10*t,"#3c78ff");circ(x+gp,P.y+12+26*(1-t),12+10*t,"#ff3246")}
 if(S.kame){const k=S.kame;if(k.ph==0){circ(sx(P.x+(S.face==1?P.w:0)),P.y+27,5+(1-k.t/40)*18,"#5abeff")}else{const x=k.dir==1?sx(P.x+46):sx(P.x-46-650);rect(x,P.y-1,650,56,"#5abeff");rect(x,P.y+16,650,22,"#fff")}}
 if(S.bolt&&S.bolt.t%4){rect(0,0,W,H,"rgba(255,255,255,.2)");S.bolt.seg.forEach(s=>{line(sx(s[0]),s[1],sx(s[2]),s[3],"#78beff",7);line(sx(s[0]),s[1],sx(s[2]),s[3],"#fff",2)})}
 if(!S.inv||S.inv%10<5){
  if(S.drag>0){g.fillStyle="#1ea03c";g.beginPath();g.ellipse(sx(P.x)+20,P.y+20,34,15,0,0,7);g.fill();circ(sx(P.x)+20+S.face*38,P.y+12,13,"#1ea03c");tri([sx(P.x),P.y+8],[sx(P.x)+30,P.y+8],[sx(P.x)+10,P.y+(S.tick>>3&1?-20:0)],"#0a5a28")}
  else{if(S.hs)dh(sx(P.x)+20,P.y+60,S.face,K.ArrowLeft||K.ArrowRight||T.left||T.right||!P.on,S.hs.c,1);fig(sx(P.x),P.y,40,40,S.ui>0?"#d7e1f0":"#000");const k=cw(),hx=sx(P.x)+(S.face==1?40:0),hy=P.y+27;
   if(k){const d=WP[k];if(d.k=="melee"){const sw=S.swing>0;line(hx,hy,hx+S.face*(sw?d.r:12),sw?hy-10+(8-S.swing)*4:hy-d.r/2,d.c,4)}else line(hx,hy,hx+S.face*16,hy,d.c,6)}}}
 drawFront(sx);if(S.shield>0&&(S.shield>60||S.tick%10<5)){g.strokeStyle="#00dcff";g.lineWidth=4;g.beginPath();g.arc(sx(P.x)+20,P.y+20,S.drag?60:34,0,7);g.stroke()}
 if(S.ui>0){g.strokeStyle="#d7e1f0";g.lineWidth=3;g.beginPath();g.ellipse(sx(P.x)+20,P.y+20,30,30,0,0,7);g.stroke()}
 hud();
 if(scr=="cut")cutDraw();
}

 rect(10,36,200,18,"#505050");rect(10,36,200*S.hp/100,18,"#c80000");g.strokeStyle="#000";g.lineWidth=2;g.strokeRect(10,36,200,18);

/* ---------- input & UI ---------- */
const GAMEKEYS=["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"];
addEventListener("keydown",e=>{
 if(GAMEKEYS.includes(e.code)||e.code=="Tab")e.preventDefault();
 K[e.code]=1;audioInit();if(e.code=="Tab"){togMu();return}
 if(scr=="menu"){if(e.code=="Digit1")start("story");else if(e.code=="Digit2")start("hard");else if(e.code=="Digit3")start("endless");else if(e.code=="KeyE")toggleMap();else if(e.code=="Enter"||e.code=="Space")start(mode);return}
 if(scr=="over"){if(e.code=="KeyR")start(mode);else if(e.code=="KeyM")toMenu();return}
 if(scr=="cut"){cutSkip();return}if(scr!="play")return;
 if(e.code=="Escape")$("cheats").hidden=true;
 if(!$("cheats").hidden)return;
 const ch=e.key.length==1?e.key.toLowerCase():"";
 if(e.code=="KeyL"&&!cont("l"))cycleW();
 if(e.code=="KeyQ")cycleA();
 if(e.code=="KeyZ"&&!cont("z"))useAb();
 if(ch&&mode!="hard"){S.typed=(S.typed+ch).slice(-12);const w=CHW.find(c=>S.typed.endsWith(c));if(w){S.typed="";give(CH[w])}}
});
addEventListener("keyup",e=>{K[e.code]=0});
addEventListener("blur",()=>{for(const k in K)K[k]=0});
function cycleW(){if(S.wp.length){S.cur=(S.cur+1)%S.wp.length;say("Weapon: "+WP[cw()].n)}}
function cycleA(){if(!S.ab.length)say("No abilities yet - defeat a boss!");else{S.abi=(S.abi+1)%S.ab.length;say("Ability: "+AB[S.ab[S.abi]].n)}}
function toggleMap(){map=map=="egypt"?"grass":"egypt";$("mapb").textContent="MAP: "+(map=="egypt"?"EGYPT":"GRASSLAND")}
function start(m){mode=m;reset();scr="play";$("menu").hidden=true;$("over").hidden=true;$("cheats").hidden=true;say(m=="endless"?"ENDLESS MODE  -  how far can you get?":m=="hard"?"HARD STORY  -  no cheats":"STORY MODE");showTouch()}
function toMenu(){scr="menu";$("over").hidden=true;$("menu").hidden=false}
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>start(b.dataset.m));
$("mapb").onclick=toggleMap;$("again").onclick=()=>start(mode);$("tomenu").onclick=toMenu;$("cx").onclick=()=>$("cheats").hidden=true;
const cg=$("cg");Object.keys(CH).filter(k=>!["thor","goku","gojo","zoro","instinct","king","father","bat","usb","moon","genkidama"].includes(k)).forEach(k=>{const b=document.createElement("button");b.textContent=(WP[k]?WP[k].n:AB[k]?AB[k].n:k.toUpperCase());b.onclick=()=>{give(CH[k]);$("cheats").hidden=true};cg.appendChild(b)});
function showTouch(){$("tc").hidden=!(touchOn&&scr=="play")}
let touchOn=matchMedia("(pointer:coarse)").matches||navigator.maxTouchPoints>0;
addEventListener("touchstart",()=>{touchOn=true;showTouch();$("hint").textContent="Tap a mode to start"},{passive:true});
$("hint").textContent=touchOn?"Tap a mode to start":"1 / 2 / 3 or click a mode.  E = map.  Arrows = move, Space = jump, X = fire, L = weapon, Z = use ability, Q = switch ability.  Type a cheat word anywhere.";
const tc=$("tc"),tcB=[].slice.call(tc.querySelectorAll(".t")),ptr={};
const tHit=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest?e.closest("#tc .t"):null};
function tSync(){const on=new Set();for(const id in ptr)if(ptr[id])on.add(ptr[id]);tcB.forEach(b=>{const h=on.has(b);b.style.opacity=h?1:"";if(b.dataset.k)T[b.dataset.k]=h?1:0})}
function tClear(){for(const id in ptr)delete ptr[id];tSync()}
tc.addEventListener("pointerdown",e=>{
 e.preventDefault();audioInit();const b=tHit(e.clientX,e.clientY);ptr[e.pointerId]=b;
 try{tc.setPointerCapture(e.pointerId)}catch(_){}
 if(b&&b.dataset.a&&scr=="play"){const a=b.dataset.a;if(a=="wp")cycleW();else if(a=="ab")cycleA();else if(a=="use")useAb();else if(a=="ch"&&mode!="hard")$("cheats").hidden=false;else if(a=="mu")togMu()}
 tSync();
});
tc.addEventListener("pointermove",e=>{if(e.pointerId in ptr){const b=tHit(e.clientX,e.clientY);if(b!==ptr[e.pointerId]){ptr[e.pointerId]=b&&b.dataset.k?b:null;tSync()}}});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>tc.addEventListener(ev,e=>{delete ptr[e.pointerId];tSync()}));

/* ---- gamepad (DualSense / any standard controller) ---- */
const pp={},pv={};let msel=0,cfi=0,padSeen=0;
function pad(){
 const gs=navigator.getGamepads?navigator.getGamepads():[];let gp=null;
 for(let i=0;i<gs.length;i++)if(gs[i]&&gs[i].connected){gp=gs[i];break}
 if(!gp)return;
 if(!padSeen){padSeen=1;$("hint").textContent="Controller: D-pad / stick = move, \u2715 = jump, \u25A1 or R2 = fire, L1 = weapon, R1 = switch ability, \u25B3 = use ability, Options = cheats, Create = music.  \u2715 starts the game, \u25B3 changes the map."}
 const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),sx=gp.axes[0]||0,sy=gp.axes[1]||0;
 const n={left:b(14)||sx<-.4,right:b(15)||sx>.4,up:b(12)||sy<-.5,down:b(13)||sy>.5,x:b(0),o:b(1),sq:b(2),tri:b(3),l1:b(4),r1:b(5),r2:b(7),opt:b(9),cre:b(8)||b(17)};
 if(Object.keys(n).some(k=>n[k]))audioInit();
 const hd={left:n.left,right:n.right,jump:n.x,fire:n.sq||n.r2,down:n.down};
 for(const k in hd){if(hd[k]){T[k]=1;pv[k]=1}else if(pv[k]){T[k]=0;pv[k]=0}}
 const p=k=>n[k]&&!pp[k],cm=!$("cheats").hidden;
 if(scr=="menu"){
  if(p("left"))msel=(msel+2)%3;if(p("right"))msel=(msel+1)%3;if(p("tri"))toggleMap();
  document.querySelectorAll("[data-m]").forEach((e,i)=>e.style.outline=i==msel?"4px solid #ffc828":"");
  if(p("x"))start(["story","hard","endless"][msel]);
 }else if(scr=="over"){if(p("x"))start(mode);else if(p("o"))toMenu()}
 else if(scr=="cut"){if(["x","o","sq","tri","opt"].some(k=>p(k)))cutSkip()}
 else if(scr=="play"){
  if(cm){const bs=[].slice.call(cg.children);
   if(p("left"))cfi=Math.max(0,cfi-1);if(p("right"))cfi=Math.min(bs.length-1,cfi+1);if(p("up"))cfi=Math.max(0,cfi-4);if(p("down"))cfi=Math.min(bs.length-1,cfi+4);
   bs.forEach((e,i)=>e.style.outline=i==cfi?"3px solid #e00":"");
   if(p("x")&&bs[cfi])bs[cfi].click();if(p("o")||p("opt"))$("cheats").hidden=true;
  }else{
   if(p("l1"))cycleW();if(p("r1"))cycleA();if(p("tri"))useAb();if(p("cre"))togMu();
   if(p("opt")&&mode!="hard"){$("cheats").hidden=false;cfi=0}
  }
 }
 for(const k in n)pp[k]=n[k];
}
let last=performance.now(),acc=0;
reset();scr="menu";
function loop(t){acc=Math.min(acc+t-last,50);last=t;pad();const hold=touchOn&&innerHeight>innerWidth;const sh=touchOn&&scr=="play"&&$("cheats").hidden;if(tc.hidden==sh){tc.hidden=!sh;if(!sh)tClear()}while(acc>=16.67){acc-=16.67;if(hold)continue;if(scr=="play")update();else if(scr=="end")endStep();else if(scr=="cut")cutStep()}musicTick();draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
